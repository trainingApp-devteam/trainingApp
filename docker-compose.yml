services:
  frontend:
    build: ./frontend
    environment:
      VITE_BACKEND_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: training_app
      MYSQL_USER: training_app
      MYSQL_PASSWORD: training_app_local
      MYSQL_ROOT_PASSWORD: root_local_only
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://db:3306/training_app?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: training_app
      DB_PASSWORD: training_app_local
      SESSION_COOKIE_SECURE: "false"
      TRAININGAPP_ADMIN_USERNAME: admin
      TRAININGAPP_ADMIN_PASSWORD: local-test-password
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  frontend_node_modules:
  mysql_data: