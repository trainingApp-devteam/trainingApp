# 本番/検証サーバー(単一VPS)用。使い方は docs/operations/deployment.md を参照。
# 必須の環境変数は .env.prod.example を .env.prod にコピーして設定する。
services:
  caddy:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/trainingapp-frontend:${APP_VERSION:?APP_VERSION is required}
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/trainingapp-backend:${APP_VERSION:?APP_VERSION is required}
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SESSION_COOKIE_SECURE: "true"
      TRAININGAPP_ADMIN_USERNAME: ${TRAININGAPP_ADMIN_USERNAME:-}
      TRAININGAPP_ADMIN_PASSWORD: ${TRAININGAPP_ADMIN_PASSWORD:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
