name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'イメージのバージョンタグ (例: v0.1.0)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Build and push images (GHCR)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and owner
        id: meta
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/trainingapp-backend:${{ steps.meta.outputs.version }}

      - name: Build and push frontend (Caddy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/trainingapp-frontend:${{ steps.meta.outputs.version }}

  release-notes:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes

  deploy:
    name: Deploy to server (optional)
    runs-on: ubuntu-latest
    needs: images
    # リポジトリ変数 DEPLOY_ENABLED=true と、下記のSecretsを設定した場合のみ実行する
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/trainingapp' }}
          VERSION: ${{ needs.images.outputs.version }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$DEPLOY_SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && sed -i 's/^APP_VERSION=.*/APP_VERSION=$VERSION/' .env.prod && docker compose --env-file .env.prod -f docker-compose.prod.yml pull && docker compose --env-file .env.prod -f docker-compose.prod.yml up -d"
