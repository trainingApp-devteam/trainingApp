name: CI

on:
  push:
    branches: [ main, ichikawa_work ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test (frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Lint (if configured)
        run: npm run lint --if-present
        working-directory: frontend

      - name: Run tests (if configured)
        run: npm run test --if-present
        working-directory: frontend

  backend:
    name: Build and Test (backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: chmod +x gradlew && ./gradlew --no-daemon test bootJar
        working-directory: backend

      - name: Upload generated OpenAPI document
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-openapi
          path: backend/build/openapi/api-docs.json
          if-no-files-found: ignore

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [build, backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run E2E
        run: chmod +x ../backend/gradlew && npm run e2e
        working-directory: frontend

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
