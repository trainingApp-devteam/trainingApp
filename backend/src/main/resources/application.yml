server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

spring:
  application:
    name: trainingapp-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/trainingapp?serverTimezone=UTC}
    username: ${DB_USERNAME:trainingapp}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
      max-lifetime: 1500000
      validation-timeout: 3000
  lifecycle:
    timeout-per-shutdown-phase: 20s
  flyway:
    enabled: true
  sql:
    init:
      mode: never
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: false

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
