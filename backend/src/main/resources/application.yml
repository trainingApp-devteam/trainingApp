server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

spring:
  application:
    name: trainingapp-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/trainingapp?serverTimezone=UTC}
    username: ${DB_USERNAME:trainingapp}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  sql:
    init:
      mode: never
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health